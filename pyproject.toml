[project]
name = "lang-comp-cog-domain"
version = "0.1.0"
description = "Domain labelling of german-commons + PoTeC reading-time analysis"
requires-python = ">=3.10,<3.13"
dependencies = [
    # core ML / data
    "torch>=2.1.0",
    "transformers>=4.47.0",
    "datasets>=2.18.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.0",
    # XLM-RoBERTa tokenizer (SentencePiece) + protobuf for model loading
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    # Hugging Face Hub download
    "huggingface-hub>=0.20.0",
    # PoTeC OSF downloader
    "requests>=2.31.0",
    "tqdm>=4.65.0",
]

[tool.uv]
# Run-only project (scripts via `python -m src.*`); don't build/install it.
package = false
