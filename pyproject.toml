[project]
name = "lang-comp-cog-domain"
version = "0.1.0"
description = "Domain labelling of german-commons + PoTeC reading-time analysis"
requires-python = ">=3.10,<3.13"
dependencies = [
    # core ML / data
    "torch>=2.1.0",
    "transformers>=4.47.0,<5",
    "datasets>=2.18.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.0",
    # XLM-RoBERTa tokenizer (SentencePiece) + protobuf for model loading
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    # Hugging Face Hub download
    "huggingface-hub>=0.20.0",
    # PoTeC OSF downloader
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    # analysis pipeline
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "accelerate>=0.26.0",     # Trainer backend for DAPT fine-tuning
    "peft>=0.10.0",           # LoRA adapters (default DAPT method)
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
]

[tool.uv]
# Run-only project (scripts via `python -m src.*`); don't build/install it.
package = false

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# Run from the project root so `import src.*` resolves; tests are GPU/network-free.
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # mixedlm on the tiny synthetic frames triggers benign convergence noise.
    "ignore::statsmodels.tools.sm_exceptions.ConvergenceWarning",
    "ignore:Random effects covariance is singular:UserWarning",
]
