[project]
name = "lang-comp-cog-domain"
version = "0.1.0"
description = "Domain labelling of german-commons + PoTeC reading-time analysis"
requires-python = ">=3.10,<3.13"
dependencies = [
    # core ML / data
    "torch>=2.1.0",
    "transformers>=4.47.0,<5",
    "datasets>=2.18.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0,<3",
    "numpy>=1.24.0,<2.0",
    # mDeBERTa-v3 NLI tokenizer (SentencePiece) + protobuf for model loading
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    # Hugging Face Hub download
    "huggingface-hub>=0.20.0",
    # PoTeC OSF downloader
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    # analysis pipeline
    "scipy>=1.10.0",
    "pymer4>=0.9",            # lme4/lmerTest mixed models via rpy2 (R comes from pixi, below)
    "rpy2>=3.6",              # pymer4 R bridge; auto-resolves R_HOME from pixi's R on PATH
    "polars>=1.42",          # pymer4 0.9 dataframe backend
    "great-tables>=0.22",    # pymer4 0.9 summary tables
    "accelerate>=0.26.0",     # Trainer backend for DAPT fine-tuning
    "adapters>=1.3.0",        # AdapterHub LoRA (default DAPT method); built for transformers 4.57.x
    "matplotlib>=3.7.0",
    "formulae>=0.6.2",       # pymer4 0.9 formula parser (pymer4 declares no deps)
]

[tool.uv]
# Run-only project (scripts via `python -m src.*`); don't build/install it.
package = false

[dependency-groups]
dev = ["pytest>=8.0"]

# ── pixi: one env for Python + the R backend ─────────────────────────────────
# conda-forge supplies R + lme4/lmerTest (precompiled — no system R, Fortran, or
# root); [project.dependencies] are installed as PyPI deps into the same env.
# pixi activation puts this R first on PATH, so rpy2 auto-resolves R_HOME — the
# old hardcoded .env path is gone.  Bootstrap a fresh machine with `pixi install`.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.24,<2"     # keep conda's pin in sync with the PyPI numpy<2 pin
rpy2 = ">=3.6"          # from conda-forge: prebuilt against this R (PyPI sdist won't link)
r-base = ">=4.4,<4.6"   # let the solver match rpy2's R build (4.4 or 4.5) — avoids backtracking
# pymer4 0.9's tidystats layer importr()s this whole easystats chain at import.
r-lme4 = "*"
r-lmertest = "*"
r-tibble = "*"
r-broom = "*"
"r-broom.mixed" = "*"
r-emmeans = "*"
r-insight = "*"
r-parameters = "*"
r-performance = "*"
r-report = "*"

[tool.pixi.pypi-dependencies]
# Run-only repo (package = false): install the pinned runtime deps directly
# rather than building this project as a package.
lang-comp-cog-domain = { path = ".", editable = false }

[tool.pixi.environments]
default = { features = ["dev"] }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8.0"

[tool.pixi.tasks]
main = "python -m src.main"
prep = "python -m src.acquire.domain_preprocessing"
tune = "python -m src.modeling.finetune"
test = "pytest"
# Data acquisition (see init.sh for the PoTeC clone + HF-token orchestration).
download-eyetracking = "python -m src.acquire.download_potec"
download-commons = "python -m src.acquire.download_commons"
label-domains = "python -m src.acquire.domain_preprocessing"

[tool.pytest.ini_options]
# Run from the project root so `import src.*` resolves; tests are GPU/network-free.
testpaths = ["tests"]
addopts = "-q"
